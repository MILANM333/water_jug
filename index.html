<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Jug Riddle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="main-container">
    
    <!-- Header -->
    <header class="header">
      <h1>Water Jug Riddle</h1>
      <p>Measure exactly <strong id="target-text">2 Liters</strong> using 8L, 5L, and 3L jugs.</p>
      
      <!-- Target Goal Selection: Only 2L, 6L, 1L, 4L, 7L -->
      <div class="goal-picker">
        <span class="goal-label">Target:</span>
        <button class="goal-chip active" data-goal="2">2 Liters</button>
        <button class="goal-chip" data-goal="6">6 Liters</button>
        <button class="goal-chip" data-goal="1">1 Liter</button>
        <button class="goal-chip" data-goal="4">4 Liters</button>
        <button class="goal-chip" data-goal="7">7 Liters</button>
      </div>
    </header>

    <!-- Tap Station -->
    <div class="tap-station">
      <div class="tap">
        <div class="tap-body"></div>
        <div class="tap-spout">
          <div class="tap-water" id="tap-water"></div>
        </div>
      </div>
      <div class="tap-buttons">
        <button class="btn btn-tap" id="fill-8-btn">Fill 8L</button>
        <button class="btn btn-tap" id="fill-5-btn">Fill 5L</button>
        <button class="btn btn-tap" id="fill-3-btn">Fill 3L</button>
      </div>
    </div>

    <!-- The 3 Plain Jugs (8L, 5L, 3L) -->
    <div class="jugs-container">
      
      <!-- 8L Jug -->
      <div class="jug-box">
        <div class="jug-label">8-Liter Jug</div>
        <div class="jug-wrapper">
          <div class="jug jug-8" id="jug-8">
            <div class="water" id="water-8" style="height: 0%;"></div>
          </div>
        </div>
        <div class="jug-controls">
          <button class="btn btn-action" id="pour-8-to-5-btn">→ 5L</button>
          <button class="btn btn-action" id="pour-8-to-3-btn">→ 3L</button>
          <button class="btn btn-danger" id="empty-8-btn">Empty</button>
        </div>
      </div>

      <!-- 5L Jug -->
      <div class="jug-box">
        <div class="jug-label">5-Liter Jug</div>
        <div class="jug-wrapper">
          <div class="jug jug-5" id="jug-5">
            <div class="water" id="water-5" style="height: 0%;"></div>
          </div>
        </div>
        <div class="jug-controls">
          <button class="btn btn-action" id="pour-5-to-8-btn">→ 8L</button>
          <button class="btn btn-action" id="pour-5-to-3-btn">→ 3L</button>
          <button class="btn btn-danger" id="empty-5-btn">Empty</button>
        </div>
      </div>

      <!-- 3L Jug -->
      <div class="jug-box">
        <div class="jug-label">3-Liter Jug</div>
        <div class="jug-wrapper">
          <div class="jug jug-3" id="jug-3">
            <div class="water" id="water-3" style="height: 0%;"></div>
          </div>
        </div>
        <div class="jug-controls">
          <button class="btn btn-action" id="pour-3-to-8-btn">→ 8L</button>
          <button class="btn btn-action" id="pour-3-to-5-btn">→ 5L</button>
          <button class="btn btn-danger" id="empty-3-btn">Empty</button>
        </div>
      </div>

    </div>

    <!-- Bottom: Test Button, Result, and Reset -->
    <div class="bottom-section">
      <button class="btn btn-test" id="test-btn">Test for 2 Liters</button>
      <div class="result-message" id="result-message"></div>
      <button class="btn btn-reset" id="reset-btn">Reset Jugs</button>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
